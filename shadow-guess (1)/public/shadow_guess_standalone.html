@keyframes wiggle {
  0%, 100% {
    transform: rotate(0) scale(1);
  }

  25% {
    transform: rotate(-8deg) scale(1.05);
  }

  75% {
    transform: rotate(8deg) scale(1.05);
  }
}

@keyframes popIn {
  0% {
    opacity: 0;
    transform: scale(.6);
  }

  70% {
    opacity: 1;
    transform: scale(1.15);
  }

  100% {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes floatGentle {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-4px);
  }
}

.animate-wiggle {
  animation: .4s ease-in-out wiggle;
}

.animate-pop-in {
  animation: .35s cubic-bezier(.175, .885, .32, 1.275) popIn;
}

.animate-float {
  animation: 2.5s ease-in-out infinite floatGentle;
}
